[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypt-sound"
version = "0.1.0"
description = "Experimental transcode-tolerant full-track audio scrambling"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
crypt-sound = "crypt_sound.cli:main"

[tool.setuptools.package-data]
crypt_sound = ["web/*"]

[tool.setuptools.packages.find]
include = ["crypt_sound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
